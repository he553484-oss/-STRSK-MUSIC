name: iOS 26 baseline · Luma upstream

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Checkout audit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Fetch exact unmodified Luma snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: knp-org/luma-ios
          ref: 7006a4b51aa3bc5a1175036ea7ec83034fdccbfe
          path: upstream-luma
          persist-credentials: false

      - name: Select Xcode 26.6
        id: xcode
        run: |
          mkdir -p "$RUNNER_TEMP/luma-baseline"
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer 2>&1 | tee "$RUNNER_TEMP/luma-baseline/xcode-select.log"
        shell: bash

      - name: Build Release arm64 for iOS
        id: release
        run: scripts/verify-luma-baseline.sh upstream-luma "$RUNNER_TEMP/luma-baseline" release
        shell: bash

      - name: Build app and test targets for iPhone Simulator
        id: simulator-build
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        run: scripts/verify-luma-baseline.sh upstream-luma "$RUNNER_TEMP/luma-baseline" simulator-build
        shell: bash

      - name: Run original iOS test suite
        id: simulator-tests
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' }}
        run: scripts/verify-luma-baseline.sh upstream-luma "$RUNNER_TEMP/luma-baseline" simulator-test
        shell: bash

      - name: Record verification status
        if: ${{ !cancelled() && steps.xcode.outcome != 'skipped' }}
        env:
          RELEASE: ${{ steps.release.outcome }}
          SIMULATOR_BUILD: ${{ steps.simulator-build.outcome }}
          SIMULATOR_TESTS: ${{ steps.simulator-tests.outcome }}
        run: |
          printf 'Release=%s\nSimulator build=%s\nSimulator tests=%s\n' "$RELEASE" "$SIMULATOR_BUILD" "$SIMULATOR_TESTS" | tee "$RUNNER_TEMP/luma-baseline/status.log"
        shell: bash

      - name: Archive Xcode result bundles
        if: always()
        run: |
          results="$RUNNER_TEMP/luma-baseline"
          shopt -s nullglob
          bundles=("$results"/*.xcresult)
          if (( ${#bundles[@]} )); then
            names=()
            for bundle in "${bundles[@]}"; do
              names+=("${bundle##*/}")
            done
            tar -czf "$results/xcode-results.tar.gz" -C "$results" "${names[@]}"
          fi
        shell: bash

      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: luma-baseline-validation
          path: |
            ${{ runner.temp }}/luma-baseline/*.log
            ${{ runner.temp }}/luma-baseline/*.json
            ${{ runner.temp }}/luma-baseline/*.txt
            ${{ runner.temp }}/luma-baseline/xcode-results.tar.gz
          if-no-files-found: warn
